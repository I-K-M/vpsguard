name: Security CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Shell and Python validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck ./*.sh tests/*.sh
          python3 -m unittest discover -s tests -v
          git diff --check
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Secret and configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: source-scan.json
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence
          path: source-scan.json
          retention-days: 30
  vm:
    name: Host integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Real systemd, SSH and UFW scenarios on a disposable VM
        run: bash tests/vm.sh
      - name: Retain sanitised integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vm-evidence-${{ matrix.os }}
          path: reports/
          retention-days: 30
  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [source, vm, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          assert all(job['result']=='success' for job in json.loads(os.environ['RESULTS']).values())
          PYCODE
  package:
    needs: [source, vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package versioned release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          mkdir -p staging
          cp vpsguard.py vpsguard.sh README.md SECURITY.md staging/
          cp -r docs staging/
          python3 - <<'PYCODE'
          import os,pathlib
          p=pathlib.Path('staging/vpsguard.py')
          p.write_text(p.read_text().replace("VERSION = '0.2.0-dev'", "VERSION = '"+os.environ['RELEASE_TAG'][1:]+"'"))
          PYCODE
          chmod 755 staging/vpsguard.sh
          tar -czf "dist/vpsguard-$RELEASE_TAG.tar.gz" -C staging .
          (cd dist && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 3
  release:
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Publication executes no code from the repository.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload
          path: dist
          digest-mismatch: error
      - name: Verify payload checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3 commit
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Sign, verify and publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          identity="https://github.com/$REPOSITORY/.github/workflows/security.yml@refs/tags/$RELEASE_TAG"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes 'Versioned artifacts with checksums, keyless signature and GitHub provenance. See docs/delivery.md for verification and limits.' dist/*
